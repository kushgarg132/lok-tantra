apiVersion: v1
kind: Namespace
metadata:
  name: loktantra
  labels:
    app.kubernetes.io/part-of: loktantra
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: loktantra-quota
  namespace: loktantra
spec:
  hard:
    requests.cpu:    "8"
    requests.memory: 16Gi
    limits.cpu:      "16"
    limits.memory:   32Gi
    pods:            "50"
    services:        "10"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: loktantra-limits
  namespace: loktantra
spec:
  limits:
    - type: Container
      default:
        cpu:    500m
        memory: 512Mi
      defaultRequest:
        cpu:    100m
        memory: 128Mi
      max:
        cpu:    "4"
        memory: 8Gi
