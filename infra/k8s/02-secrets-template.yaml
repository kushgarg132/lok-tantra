# DO NOT commit real values — populate via CI/CD from Google Secret Manager
# Apply with: kubectl apply -f - <<< "$(envsubst < 02-secrets-template.yaml)"
apiVersion: v1
kind: Secret
metadata:
  name: loktantra-secrets
  namespace: loktantra
  labels:
    app.kubernetes.io/part-of: loktantra
type: Opaque
stringData:
  DATABASE_URL:          "postgresql://loktantra:${DB_PASSWORD}@${DB_HOST}:5432/loktantra?sslmode=require"
  REDIS_URL:             "rediss://:${REDIS_AUTH}@${REDIS_HOST}:6380"
  NEXTAUTH_SECRET:       "${NEXTAUTH_SECRET}"
  NEXTAUTH_URL:          "https://loktantra.in"
  GOOGLE_CLIENT_ID:      "${GOOGLE_CLIENT_ID}"
  GOOGLE_CLIENT_SECRET:  "${GOOGLE_CLIENT_SECRET}"
  ANTHROPIC_API_KEY:     "${ANTHROPIC_API_KEY}"
  ELASTICSEARCH_URL:     "https://${ES_HOST}:9200"
  ELASTICSEARCH_API_KEY: "${ES_API_KEY}"
  SLACK_WEBHOOK_URL:     "${SLACK_WEBHOOK_URL}"
  ADMIN_API_KEY:         "${ADMIN_API_KEY}"
