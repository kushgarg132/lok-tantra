apiVersion: v1
kind: Service
metadata:
  name: loktantra-app
  namespace: loktantra
  labels:
    app: loktantra-app
    app.kubernetes.io/part-of: loktantra
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # GKE NEG for Container-native LB
spec:
  selector:
    app: loktantra-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
