apiVersion: apps/v1
kind: Deployment
metadata:
  name: loktantra-app
  namespace: loktantra
  labels:
    app:     loktantra-app
    version: "1.0"
    app.kubernetes.io/part-of: loktantra
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: loktantra-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # Zero-downtime: never remove a pod before replacement is ready
      maxSurge:       1
  template:
    metadata:
      labels:
        app:     loktantra-app
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "3000"
        prometheus.io/path:   "/api/metrics"
    spec:
      # ── Security context ───────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1001
        runAsGroup:   1001
        fsGroup:      1001
        seccompProfile:
          type: RuntimeDefault

      # ── Spread across zones for HA ─────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew:           1
          topologyKey:       topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: loktantra-app

      # Prefer different nodes within a zone
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: loktantra-app

      terminationGracePeriodSeconds: 60

      # ── Cloud SQL Auth Proxy sidecar ───────────────────────────────────────
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z "$DB_HOST" 5432; do echo waiting for database; sleep 2; done']
          env:
            - name: DB_HOST
              value: "127.0.0.1"

      containers:
        # Cloud SQL Auth Proxy (sidecar)
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11
          args:
            - --port=5432
            - --structured-logs
            - $(INSTANCE_CONNECTION_NAME)
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: loktantra-secrets
                  key: CLOUD_SQL_INSTANCE
          securityContext:
            runAsNonRoot: true
            runAsUser:    65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }

        # ── Main Next.js application ─────────────────────────────────────────
        - name: app
          image: ghcr.io/loktantra/loktantra/app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: loktantra-config
            - secretRef:
                name: loktantra-secrets

          # ── Health probes ─────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    24   # 2 minutes total startup time
            successThreshold:    1

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds:       10
            failureThreshold:    3
            successThreshold:    1
            timeoutSeconds:      5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds:       20
            failureThreshold:    3
            successThreshold:    1
            timeoutSeconds:      10

          # ── Resources ─────────────────────────────────────────────────────
          resources:
            requests:
              cpu:    250m
              memory: 384Mi
            limits:
              cpu:    "1"
              memory: 1Gi

          # ── Security ──────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false   # Next.js writes to .next/cache
            capabilities:
              drop: ["ALL"]

          # ── Graceful shutdown ─────────────────────────────────────────────
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
