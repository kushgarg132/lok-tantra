apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loktantra-ingress
  namespace: loktantra
  annotations:
    # NGINX ingress controller
    kubernetes.io/ingress.class: nginx

    # TLS via cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Rate limiting at ingress level (defence in depth)
    nginx.ingress.kubernetes.io/limit-rps:         "50"
    nginx.ingress.kubernetes.io/limit-connections:  "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Body size (allow document uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Security headers (supplement app-level headers)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";

    # Enable CORS for API (Next.js handles it, but ingress can whitelist)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://loktantra.in,https://staging.loktantra.in"

    # WebSocket support (for potential real-time features)
    nginx.ingress.kubernetes.io/proxy-http-version:      "1.1"
    nginx.ingress.kubernetes.io/proxy-set-header-Upgrade: "$http_upgrade"

spec:
  tls:
    - hosts:
        - loktantra.in
        - www.loktantra.in
      secretName: loktantra-tls

  rules:
    - host: loktantra.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loktantra-app
                port:
                  number: 80

    # Redirect www to apex
    - host: www.loktantra.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loktantra-app
                port:
                  number: 80
